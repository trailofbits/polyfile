[build-system]
# setuptools 83.0.0 is the first release that normalizes Unicode when matching MANIFEST.in
# `exclude` directives (PYSEC-2026-3447). PolyFile relies on those directives to keep
# specifications it may not redistribute out of the source distribution, so this is a
# build-time requirement, not only a runtime one.
requires = ["setuptools>=83.0.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "polyfile"
version = "0.6.0"
description = "A utility to recursively map the structure of a file."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Trail of Bits" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "abnf~=2.2.0",
    "cint>=1.0.0",
    "fickling>=0.0.8",
    "filelock>=3.20.3",
    "graphviz>=0.20.1",
    "intervaltree>=2.4.0",
    "jinja2>=2.1.0",
    "kaitaistruct~=0.11",
    "networkx>=2.6.3",
    "packaging>=21.0",
    "pdfminer.six>=20251230",
    "Pillow>=5.0.0",
    "pyreadline3; platform_system == 'Windows'",
    "pyyaml>=3.13",
    # Also the floor that keeps CI's pip-audit of the installed environment clean
    # (PYSEC-2026-3447). Bump this together with [build-system] requires.
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
demangle = ["cxxfilt"]
dev = ["mypy", "pytest", "flake8"]

[project.scripts]
polyfile = "polyfile.__main__:main"

[project.urls]
Homepage = "https://github.com/trailofbits/polyfile"
Repository = "https://github.com/trailofbits/polyfile"
Issues = "https://github.com/trailofbits/polyfile/issues"

[tool.setuptools]
include-package-data = true

# An explicit `include` is required. This is a flat layout with several non-package top-level
# directories, and `packages.find` defaults to namespaces = true, which would otherwise
# discover the format library, the `file` submodule, docs, logo, testdata and hooks as
# packages. Omitting this table is worse still: flat-layout auto-discovery fails outright.
[tool.setuptools.packages.find]
where = ["."]
include = ["polyfile*", "polymerge*"]
namespaces = false

# polyfile.magic_defs and polyfile.kaitai.parsers are packages, so their non-Python files
# still have to be declared here. polyfile/magic.py enumerates the installed magic_defs
# directory, so an omission changes which file types PolyFile can detect.
[tool.setuptools.package-data]
polyfile = ["templates/*"]
"polyfile.kaitai.parsers" = ["*.py", "manifest.json"]
"polyfile.magic_defs" = ["*"]
