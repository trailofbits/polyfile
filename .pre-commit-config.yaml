repos:
  - repo: local
    hooks:
      - id: blocking-python-lint
        name: Check Python syntax and names
        language: system
        entry: >-
          uv run flake8 polyfile polymerge tests build_backend.py compile_kaitai_parsers.py
          --count --select=E9,F63,F7,F82 --show-source --statistics
        pass_filenames: false
        types: [python]
      - id: project-types
        name: Check project types
        language: system
        entry: uv run ty check --error-on-warning
        pass_filenames: false
        files: |
          (?x)^(
              polyfile/.*\.py|polymerge/.*\.py|tests/.*\.py|
              build_backend\.py|compile_kaitai_parsers\.py|
              pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/.*\.ya?ml
          )$
        exclude: ^polyfile/kaitai/(parsers/|kaitai-struct-compiler-[^/]+/)
