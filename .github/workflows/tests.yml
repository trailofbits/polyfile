# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest] # windows-latest, macos-latest,
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - name: Install Python Dependencies
      # --system installs into the interpreter actions/setup-python put on the PATH, which is
      # also the environment pip-audit scans. Installing into a virtualenv would hide every
      # dependency from it. setuptools no longer needs installing here: the isolated build
      # environment gets it from [build-system] requires in pyproject.toml.
      run: uv pip install --system '.[dev]'
    - name: Scan with pip-audit
      uses: trailofbits/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names. This pass covers
        # polyfile/kaitai/parsers deliberately: E9 includes E999, so it is what catches a
        # generated parser that kaitai-struct-compiler emitted as invalid Python.
        flake8 polyfile polymerge tests build_backend.py compile_kaitai_parsers.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide. Generated
        # code will never satisfy the style and complexity checks, so it stays excluded here.
        flake8 polyfile polymerge tests build_backend.py compile_kaitai_parsers.py --exclude polyfile/kaitai/parsers --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest tests

  distributions:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - name: Build the source distribution, then a wheel from it
      # This is what the release workflow runs. Without it, a break in the build backend or in
      # MANIFEST.in would not surface until a release was already tagged.
      run: |
        set -euo pipefail
        uv build 2>&1 | tee build.log
    - name: Check distribution metadata
      run: uvx twine check dist/*
    - name: Check the distributions ship what they should
      run: |
        set -euo pipefail
        sdist=$(ls dist/*.tar.gz)
        wheel=$(ls dist/*.whl)

        # The wheel must have been built from the source distribution, reusing its parsers
        # rather than recompiling them.
        grep -q "reusing the parsers already generated" build.log

        # PolyFile is not licensed to redistribute these specifications.
        python compile_kaitai_parsers.py --audit
        while read -r spec; do
          if tar tzf "$sdist" | grep -q "/kaitai_struct_formats/${spec}$"; then
            echo "::error::${spec} reached the source distribution"
            exit 1
          fi
        done < <(sed -n 's|^exclude kaitai_struct_formats/||p' MANIFEST.in)

        # Submodule bookkeeping and autotools build output must not be packaged.
        if tar tzf "$sdist" | grep -E '/\.git$|/push_artifacts/|\.(o|lo|la|lai|so|dylib)$'; then
          echo "::error::the source distribution contains submodule build output"
          exit 1
        fi

        # Package data completeness, counted from what git tracks so it cannot drift.
        for spec in "polyfile/kaitai/parsers/*.py:polyfile/kaitai/parsers/.*\.py$" \
                    "polyfile/magic_defs/*: polyfile/magic_defs/[^/]" \
                    "polyfile/templates/*: polyfile/templates/[^/]"; do
          glob=${spec%%:*}
          pattern=${spec#*:}
          expected=$(git ls-files "$glob" | wc -l)
          actual=$(unzip -l "$wheel" | grep -c "$pattern")
          echo "$glob: wheel has $actual, git tracks $expected"
          test "$actual" -eq "$expected"
        done

        # Neither the build modules nor the format library belong in the wheel.
        if unzip -l "$wheel" | grep -E 'compile_kaitai_parsers|build_backend|\.ksy| tests/'; then
          echo "::error::the wheel contains files that should not be installed"
          exit 1
        fi
