name: Kaitai build on Windows

on:
  pull_request:
    paths:
      - .github/workflows/kaitai-windows.yml
      - build_backend.py
      - compile_kaitai_parsers.py
      - polyfile/kaitai/**
      - tests/test_kaitai_build.py

permissions:
  contents: read

jobs:
  load-generated-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --no-sync python -m pytest -q tests/test_kaitai_build.py
