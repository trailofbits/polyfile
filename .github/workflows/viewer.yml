name: HTML viewer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'feat/issue-*', 'fix/issue-*']

permissions: {}

jobs:
  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install optional browser test dependencies
        run: |
          set -euo pipefail
          uv venv
          uv pip install -e '.[dev,viewer-test]'
          uv run --no-project python -m playwright install --with-deps "${BROWSER_ENGINE}"
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
      - name: Test standalone reports offline
        run: uv run --no-project pytest -q tests/browser --browser "${BROWSER_ENGINE}"
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
          PYTHONPATH: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: viewer-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Audit and install development tools
        run: |
          set -euo pipefail
          pnpm audit --audit-level=moderate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check native viewer scripts
        run: pnpm check:viewer
